services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/decision_intelligence
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: decision_intelligence
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
  redis:
    image: redis:7
