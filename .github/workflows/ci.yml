name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked project and test dependencies
        run: uv sync --locked --extra test

      - name: Run test suite
        run: uv run --locked python -m pytest
